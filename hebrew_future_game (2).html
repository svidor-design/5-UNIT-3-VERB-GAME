<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אתגר העתיד – משחק פעלים בעברית</title><style>:root{font-family:Arial,'Noto Sans Hebrew',sans-serif;color:#202047;background:#f3f1ff}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:850px;margin:auto}.hero{background:linear-gradient(120deg,#4831a3,#7c58d9);color:white;border-radius:22px;padding:26px;text-align:center}.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,43px)}.hero p{margin:0}.card{background:white;border-radius:20px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #33216a12}label{font-weight:bold;display:block;margin:16px 0 7px}select,button{font:inherit;border-radius:12px;padding:13px;border:1px solid #c9c3e8}select{width:100%;background:#fff}button{cursor:pointer}button.primary{background:#6543cb;color:white;border:0;font-weight:bold;padding:15px 22px}button.secondary{background:#eeeafb;color:#39228c;border:0}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.hidden{display:none!important}.status{display:flex;justify-content:space-between;gap:12px;font-weight:bold}.bar{background:#e8e4f6;height:10px;border-radius:20px;margin:15px 0;overflow:hidden}.fill{background:#7650d4;height:100%;width:0;transition:width .25s}.prompt{text-align:center;background:#f4f0ff;border-radius:16px;padding:24px}.prompt .verb{font-size:34px;font-weight:800;margin:8px}.prompt .pron{font-size:28px;margin:12px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.choice{background:white;border:2px solid #d8d1ed;color:#24204e;font-weight:bold;font-size:25px;min-height:76px}.choice:hover:not(:disabled),.choice:focus-visible{border-color:#7650d4;background:#f4f0ff}.choice:disabled{cursor:default}.choice.correct{border-color:#208451;background:#e1f7e8}.choice.wrong{border-color:#bc3448;background:#ffe8eb}.feedback{margin-top:16px;font-weight:bold;text-align:center;font-size:19px;min-height:28px}.good{color:#176b42}.bad{color:#a62e42}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{padding:9px;border-bottom:1px solid #e8e4f2;text-align:right}footer{text-align:center;color:#66617f;font-size:13px;margin:25px 0}@media(max-width:480px){body{padding:10px}.card{padding:16px}.choices{gap:8px}.choice{font-size:22px}.hero{padding:20px}} </style></head><body><main class="wrap"><header class="hero"><h1>🎮 אתגר הפעלים בעתיד</h1><p>לומדים, מתרגלים ומצליחים בעברית!</p></header><section id="setup" class="card"><h2>בואו נשחק!</h2><p>בחרו פועל אחד או תרגלו את כל 12 הפעלים. כל תשובה נכונה מזכה ב־10 נקודות.</p><label for="verb">בחרו פועל</label><select id="verb"><option value="all">כל הפעלים – תרגול מעורב</option></select><label for="count">מספר שאלות</label><select id="count"><option value="10">10 שאלות – משחק קצר</option><option value="20">20 שאלות – אתגר</option><option value="40">40 שאלות – תרגול מתקדם</option></select><div class="buttons"><button class="primary" id="start">▶ התחילו לשחק</button></div></section><section id="game" class="card hidden" aria-live="polite"><div class="status"><span id="progress"></span><span id="score"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="prompt"><div>מהי צורת העתיד הנכונה?</div><div class="verb" id="inf"></div><div id="english"></div><div class="pron" id="pron"></div></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" role="status"></div><div class="buttons"><button class="primary hidden" id="next">לשאלה הבאה ←</button></div></section><section id="results" class="card hidden"><h2>🏆 כל הכבוד! סיימתם!</h2><h3 id="resultScore"></h3><p id="resultMsg"></p><div id="review"></div><div class="buttons"><button class="primary" id="again">🔄 שחקו שוב</button><button class="secondary" id="change">בחרו פועל אחר</button></div></section><footer>משחק ללימוד עברית • פועל בעתיד • פועל גם ללא חיבור לאינטרנט</footer></main><script>
const verbs=[
['לשלם','to pay',['אשלם','תשלם','תשלמי','ישלם','תשלם','נשלם','תשלמו','תשלמו','ישלמו','ישלמו']],
['לבקר','to visit',['אבקר','תבקר','תבקרי','יבקר','תבקר','נבקר','תבקרו','תבקרו','יבקרו','יבקרו']],
['לנגן','to play music',['אנגן','תנגן','תנגני','ינגן','תנגן','ננגן','תנגנו','תנגנו','ינגנו','ינגנו']],
['לדבר','to speak',['אדבר','תדבר','תדברי','ידבר','תדבר','נדבר','תדברו','תדברו','ידברו','ידברו']],
['לטייל','to travel',['אטייל','תטייל','תטיילי','יטייל','תטייל','נטייל','תטיילו','תטיילו','יטיילו','יטיילו']],
['לאחר','to be late',['אאחר','תאחר','תאחרי','יאחר','תאחר','נאחר','תאחרו','תאחרו','יאחרו','יאחרו']],
['לבשל','to cook',['אבשל','תבשל','תבשלי','יבשל','תבשל','נבשל','תבשלו','תבשלו','יבשלו','יבשלו']],
['לחפש','to search',['אחפש','תחפש','תחפשי','יחפש','תחפש','נחפש','תחפשו','תחפשו','יחפשו','יחפשו']],
['לארגן','to organize',['אארגן','תארגן','תארגני','יארגן','תארגן','נארגן','תארגנו','תארגנו','יארגנו','יארגנו']],
['לבקש','to request',['אבקש','תבקש','תבקשי','יבקש','תבקש','נבקש','תבקשו','תבקשו','יבקשו','יבקשו']],
['לצלצל','to ring',['אצלצל','תצלצל','תצלצלי','יצלצל','תצלצל','נצלצל','תצלצלו','תצלצלו','יצלצלו','יצלצלו']],
['לנצח','to win',['אנצח','תנצח','תנצחי','ינצח','תנצח','ננצח','תנצחו','תנצחו','ינצחו','ינצחו']]];
const pron=['אני','אתה','את','הוא','היא','אנחנו','אתם','אתן','הם','הן'];const $=id=>document.getElementById(id);verbs.forEach((v,i)=>{let o=document.createElement('option');o.value=i;o.textContent=v[0]+' — '+v[1];$('verb').append(o)});let questions=[],index=0,points=0,wrong=[],answered=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){['setup','game','results'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function start(){const v=$('verb').value,n=+$('count').value;let pool=[];verbs.forEach((verb,vi)=>{if(v==='all'||+v===vi)pron.forEach((p,pi)=>pool.push({vi,pi,answer:verb[2][pi]}))});questions=[];while(questions.length<n){let batch=shuffle([...pool]);questions.push(...batch.slice(0,n-questions.length))}index=0;points=0;wrong=[];show('game');render()}
function render(){answered=false;let q=questions[index],v=verbs[q.vi];$('progress').textContent=`שאלה ${index+1} מתוך ${questions.length}`;$('score').textContent=`⭐ ${points} נקודות`;$('fill').style.width=`${index/questions.length*100}%`;$('inf').textContent=v[0];$('english').textContent=v[1];$('pron').textContent=pron[q.pi]+' ______';$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');$('next').textContent=index===questions.length-1?'סיימו את המשחק':'לשאלה הבאה ←';let alternatives=[...new Set(v[2].filter(f=>f!==q.answer))];shuffle(alternatives);let opts=shuffle([q.answer,...alternatives.slice(0,3)]);$('choices').replaceChildren();opts.forEach(value=>{let b=document.createElement('button');b.className='choice';b.textContent=value;b.addEventListener('click',()=>choose(value));$('choices').append(b)})}
function choose(value){if(answered)return;answered=true;let q=questions[index],correct=value===q.answer;if(correct)points+=10;else wrong.push(q);[...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct');else if(b.textContent===value)b.classList.add('wrong')});$('score').textContent=`⭐ ${points} נקודות`;$('feedback').textContent=correct?'✓ כל הכבוד! תשובה נכונה!':`✗ התשובה הנכונה: ${pron[q.pi]} ${q.answer}`;$('feedback').classList.add(correct?'good':'bad');$('next').classList.remove('hidden')}
function next(){if(++index===questions.length){finish()}else render()}
function finish(){show('results');$('resultScore').textContent=`${points} מתוך ${questions.length*10} נקודות (${Math.round(points/(questions.length*10)*100)}%)`;$('resultMsg').textContent=wrong.length?'כדאי לחזור על הפעלים הבאים:':'מצוין! עניתם נכון על כל השאלות!';$('review').replaceChildren();if(wrong.length){let table=document.createElement('table');let tr=document.createElement('tr');['פועל','כינוי גוף','התשובה הנכונה'].forEach(x=>{let th=document.createElement('th');th.textContent=x;tr.append(th)});table.append(tr);wrong.forEach(q=>{let row=document.createElement('tr');[verbs[q.vi][0],pron[q.pi],q.answer].forEach(x=>{let td=document.createElement('td');td.textContent=x;row.append(td)});table.append(row)});$('review').append(table)}}
$('start').onclick=start;$('next').onclick=next;$('again').onclick=start;$('change').onclick=()=>show('setup');
</script></body></html>
